{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">GLOBAL SEARCH</span><h1>Results for “{{ query }}”</h1></div></div>{% for label,items in results.items %}<section><h2>{{ label|title }}</h2>{% for item in items %}<div class="result"><b>{{ item.name|default:item.title }}</b></div>{% empty %}<p class="muted">No matches.</p>{% endfor %}</section>{% endfor %}{% endblock %}
