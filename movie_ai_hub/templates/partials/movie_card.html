<article class="movie-card">
  <div class="poster" style="--hue: {{ movie.id|add:37 }};"><span>🎬</span><small>{{ movie.release_date|date:"Y"|default:"—" }}</small></div>
  <div class="movie-info"><h3><a href="{% url 'movie_detail' movie.pk %}">{{ movie.title }}</a></h3>
  <p>{% for g in movie.genres.all|slice:":2" %}{{ g.name }}{% if not forloop.last %} · {% endif %}{% endfor %}</p>
  <div class="rating">★ {{ movie.average_rating }}/10 <span>{{ movie.vote_count }} votes</span></div></div>
</article>
